<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- iOS "Add to Home Screen" uses this; without it Safari saves a
         screenshot of the page as the icon. -->
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Font declarations are bundled into app CSS; connect to their binary origin early. -->
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />

    <!-- Default fallback title — React 19 correctly overrides this per route via SeoHead.
         Per-page <meta>, <link rel="canonical">, OG, and twitter tags are emitted by
         <SeoHead> ONLY. Do not duplicate them statically here: React 19 appends rather
         than deduplicates <meta> tags, so static defaults would stay alongside the
         per-page values and browsers read the first (static) one. Result: every page
         appears to have the homepage's description.

         First-pass crawlers (text-only Googlebot) see no meta beyond the title +
         Organization JSON-LD below. JS-executing second-pass crawlers see the correct
         per-route meta. To fix first-pass too, ship prerendering — see web/SEO-IMPLEMENTATION.md. -->
    <title>CipherExam — Learn How Certification Exams Think</title>
    <meta name="theme-color" content="#020617" />
    <!-- Per-page <meta name="robots"> is emitted by SeoHead (so noindex on /404 works).
         Do NOT add a static robots meta here — React 19 doesn't dedup <meta> tags, so
         the static would win over the per-page value. Pages without SeoHead default to
         Google's index,follow behavior, which is the intended fallback. -->

    <!-- Organization + WebSite JSON-LD (sitewide trust signal) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://cipherexam.com/#org",
          "name": "CipherExam",
          "url": "https://cipherexam.com/",
          "logo": "https://cipherexam.com/favicon.png",
          "description": "AI-powered certification exam prep. Understand how exams think.",
          "founder": { "@type": "Person", "@id": "https://cipherexam.com/#dave", "name": "Dave Quillman" }
        },
        {
          "@type": "Person",
          "@id": "https://cipherexam.com/#dave",
          "name": "Dave Quillman",
          "jobTitle": "Founder, CipherExam",
          "url": "https://cipherexam.com/story",
          "worksFor": { "@id": "https://cipherexam.com/#org" },
          "sameAs": [
            "https://www.linkedin.com/in/davequillman/",
            "https://github.com/dquillman"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://cipherexam.com/#website",
          "url": "https://cipherexam.com/",
          "name": "CipherExam",
          "publisher": { "@id": "https://cipherexam.com/#org" }
        }
      ]
    }
    </script>

    <!-- Google Analytics 4.

         Loaded ONLY on the production hostnames, and never under automation.
         Before this gate, 930 of 1084 "direct" sessions in a 90-day window were
         Playwright e2e runs against http://localhost:5173 on GitHub Actions:
         every test got a fresh browser context, so GA4 counted it as a brand-new
         user with one pageview and exactly zero engagement. Daily session counts
         landed on exact multiples of 7 — the size of the e2e suite. Real cold
         traffic was ~3% of what the property reported.

         GA4's own bot filter cannot catch this: Playwright's Desktop Chrome
         device sends an ordinary Chrome/Windows user-agent with no automation
         marker. It has to be gated here.

         This also keeps those fake pageloads out of Google Ads (AW-926344271),
         where they would corrupt bid optimisation the moment paid traffic runs.

         To measure deliberately on localhost or staging, run
         localStorage.setItem('ec_ga_debug','1') in the console and reload. -->
    <script>
      (function () {
        var nav = window.navigator || {};
        if (nav.webdriver === true || /HeadlessChrome|Puppeteer|Playwright/i.test(nav.userAgent || '')) return;

        var host = location.hostname;
        var isProd = host === 'cipherexam.com' || host === 'www.cipherexam.com';
        var forced = false;
        try { forced = localStorage.getItem('ec_ga_debug') === '1'; } catch (e) { /* private mode */ }
        if (!isProd && !forced) return;

        window.dataLayer = window.dataLayer || [];
        function gtag(){ dataLayer.push(arguments); }
        window.gtag = gtag;
        var loaded = false;
        function loadGoogleAnalytics() {
          if (loaded) return;
          loaded = true;
          gtag('js', new Date());
          gtag('config', 'G-HY0QBN84Y6');
          gtag('config', 'AW-926344271');
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-HY0QBN84Y6';
          document.head.appendChild(s);
        }

        // Keep analytics out of the mobile LCP window. The queue above still
        // captures conversion calls made before the library arrives. A real
        // interaction loads it immediately; an idle visitor loads it after the
        // page has had enough time to finish its first meaningful render.
        ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function (eventName) {
          window.addEventListener(eventName, loadGoogleAnalytics, { once: true, passive: true });
        });
        window.addEventListener('load', function () {
          setTimeout(loadGoogleAnalytics, 10000);
        }, { once: true });
      })();
    </script>
  </head>
  <body style="background: #020617 !important;">
    <noscript><img height="1" width="1" style="display:none;" alt="" src="https://px.ads.linkedin.com/collect/?pid=8955004&fmt=gif" /></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Tracking pixels deferred until after the app shell renders.
         Defers ~30-80ms of main-thread blocking off the LCP path.

         DO NOT let these loaders run under the prerenderer. scripts/prerender.mjs
         drives Playwright Chromium and serializes the LIVE DOM into
         dist/{route}/index.html, so every script tag these loaders inject gets
         baked into the shipped HTML. The baked fbevents.js tag then
         loads on the real visit AND this loader injects its own copy, so
         fbevents.js executes twice, re-registers its module table, and throws
         "Uncaught TypeError: a.__fbeventsModules[e] is not a function" — after
         which every fbq() call (PageView and all conversions) is dead. It also
         compounds: each prerender pass serialized the previous pass's baked tag
         plus a fresh one, which is why dist/about/index.html shipped TWO
         fbevents/insight/clarity tags. Same failure mode for the LinkedIn
         Insight Tag and Clarity.

         Two defenses below: (1) never run under automation, so nothing is baked
         in the first place; (2) never inject a loader whose script is already
         present, so any stale/cached prerendered HTML still loads it only once. -->
    <script>
      (function () {
        var nav = window.navigator || {};
        // Playwright/Puppeteer Chromium: navigator.webdriver === true, UA contains HeadlessChrome.
        if (nav.webdriver === true || /HeadlessChrome|Puppeteer|Playwright/i.test(nav.userAgent || '')) return;
        // Production hostnames only — same reason as the GA4 gate in <head>. The
        // automation check above misses a developer running the dev server by
        // hand, and every such pageload was reaching Meta, LinkedIn and Clarity
        // as if it were a real visitor.
        var pixelHost = location.hostname;
        if (pixelHost !== 'cipherexam.com' && pixelHost !== 'www.cipherexam.com') {
          var pixelForced = false;
          try { pixelForced = localStorage.getItem('ec_ga_debug') === '1'; } catch (e) { /* private mode */ }
          if (!pixelForced) return;
        }
        if (window.__cipherPixelsLoaded) return;
        window.__cipherPixelsLoaded = true;

        // True if a script for this vendor is already in the document (e.g. baked
        // into prerendered HTML by an older build).
        function alreadyLoaded(hostFragment) {
          return !!document.querySelector('script[src*="' + hostFragment + '"]');
        }

        function loadPixels() {
          // Meta Pixel — official snippet. The stub/queue is always installed so
          // fbq() calls below are safe; only the <script> insertion is guarded.
          !function(f,b,e,v,n,t,s)
          {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
          n.callMethod.apply(n,arguments):n.queue.push(arguments)};
          if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
          n.queue=[];if(alreadyLoaded('connect.facebook.net'))return;
          t=b.createElement(e);t.async=!0;
          t.src=v;s=b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t,s)}(window, document,'script',
          'https://connect.facebook.net/en_US/fbevents.js');
          window.fbq('init', '819240414529867');
          window.fbq('track', 'PageView');

          // LinkedIn Insight Tag
          window._linkedin_partner_id = "8955004";
          window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || [];
          window._linkedin_data_partner_ids.push("8955004");
          (function(l) {
            if (!l){window.lintrk = function(a,b){window.lintrk.q.push([a,b])};
            window.lintrk.q=[]}
            if (alreadyLoaded('snap.licdn.com')) return;
            var s = document.getElementsByTagName("script")[0];
            var b = document.createElement("script");
            b.type = "text/javascript"; b.async = true;
            b.src = "https://snap.licdn.com/li.lms-analytics/insight.min.js";
            s.parentNode.insertBefore(b, s);
          })(window.lintrk);

          // Microsoft Clarity
          (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            if (alreadyLoaded("clarity.ms/tag")) return;
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
          })(window, document, "clarity", "script", "wn43n5eysh");
        }
        ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function (eventName) {
          window.addEventListener(eventName, loadPixels, { once: true, passive: true });
        });
        window.addEventListener('load', function () {
          setTimeout(loadPixels, 12000);
        }, { once: true });
      })();
    </script>
  </body>
</html>
