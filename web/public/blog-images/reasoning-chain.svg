<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-label="Diagram comparing flashcard-style answers to AI reasoning chains for certification questions">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f1830"/>
    </linearGradient>
    <linearGradient id="brandGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" fill="url(#bgGrad)"/>
  <text x="400" y="44" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="22" font-weight="700" text-anchor="middle">What "explained" actually means.</text>
  <text x="400" y="70" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">A reasoning chain is structurally different from a flashcard answer.</text>

  <!-- LEFT: Flashcard answer -->
  <g transform="translate(40,110)">
    <text x="170" y="0" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">FLASHCARD-STYLE</text>
    <rect x="0" y="20" width="340" height="80" rx="10" fill="#1a2438" stroke="#f87171" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="170" y="48" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Question: What's the FIRST step</text>
    <text x="170" y="68" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">in change control?</text>
    <text x="170" y="90" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">Answer: Assess impact. ✓</text>
    <text x="170" y="130" fill="#f87171" font-family="Inter, sans-serif" font-size="12" font-style="italic" text-anchor="middle">You know what. You don't know why.</text>
    <text x="170" y="150" fill="#f87171" font-family="Inter, sans-serif" font-size="12" font-style="italic" text-anchor="middle">The next 50 questions will break this.</text>
  </g>

  <!-- Divider arrow -->
  <g transform="translate(400,170)">
    <text x="0" y="0" fill="#a78bfa" font-family="Inter, sans-serif" font-size="22" font-weight="800" text-anchor="middle">vs.</text>
  </g>

  <!-- RIGHT: Reasoning chain -->
  <g transform="translate(420,110)">
    <text x="170" y="0" fill="#a78bfa" font-family="Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">REASONING CHAIN</text>
    <rect x="0" y="20" width="340" height="80" rx="10" fill="#1a2438" stroke="url(#brandGrad2)" stroke-opacity="0.85" stroke-width="2"/>
    <text x="170" y="48" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Same question.</text>
    <text x="170" y="68" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Answer: Assess impact.</text>
    <text x="170" y="90" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">Plus three steps of how PMI ranks it.</text>
  </g>

  <!-- The chain (right side, below the boxed answer) -->
  <g transform="translate(420,260)">
    <rect width="340" height="30" rx="6" fill="#1a2438" stroke="#7aa2ff" stroke-opacity="0.5" stroke-width="1"/>
    <text x="14" y="20" fill="#7aa2ff" font-family="Inter, sans-serif" font-size="11" font-weight="700">1. FRAME</text>
    <text x="100" y="20" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="12">PMI Decision Lens: data before action.</text>
  </g>
  <line x1="590" y1="290" x2="590" y2="300" stroke="#7aa2ff" stroke-opacity="0.4" stroke-width="1.5"/>
  <g transform="translate(420,300)">
    <rect width="340" height="30" rx="6" fill="#1a2438" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="1"/>
    <text x="14" y="20" fill="#a78bfa" font-family="Inter, sans-serif" font-size="11" font-weight="700">2. RULE</text>
    <text x="100" y="20" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="12">Impact analysis precedes CCB review.</text>
  </g>
  <line x1="590" y1="330" x2="590" y2="340" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1.5"/>
  <g transform="translate(420,340)">
    <rect width="340" height="30" rx="6" fill="#1a2438" stroke="#34d399" stroke-opacity="0.5" stroke-width="1"/>
    <text x="14" y="20" fill="#34d399" font-family="Inter, sans-serif" font-size="11" font-weight="700">3. TRAP</text>
    <text x="100" y="20" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="12">"Escalate" sounds responsible — but skips data.</text>
  </g>
  <line x1="590" y1="370" x2="590" y2="380" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5"/>
  <g transform="translate(420,380)">
    <rect width="340" height="30" rx="6" fill="#1a2438" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1"/>
    <text x="14" y="20" fill="#fbbf24" font-family="Inter, sans-serif" font-size="11" font-weight="700">4. TRANSFER</text>
    <text x="100" y="20" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="12">Apply the lens to any "FIRST" question.</text>
  </g>

  <!-- Bottom payoff -->
  <g transform="translate(40,440)">
    <text x="380" y="40" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle">The flashcard teaches one question. The chain teaches a pattern.</text>
    <text x="380" y="64" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">CipherExam writes the chain for every question — right answers included.</text>
    <text x="380" y="92" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Illustrative example, not from any real exam.</text>
  </g>
</svg>
