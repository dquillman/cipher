<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-label="Diagram showing why all four answer choices look right on a certification exam question">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f1830"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" fill="url(#bgGrad)"/>
  <text x="400" y="44" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="22" font-weight="700" text-anchor="middle">All four answers are technically defensible.</text>
  <text x="400" y="70" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">That's the design. Only one is "BEST" — and recognizing why is the skill the exam grades.</text>

  <!-- Question stem -->
  <g transform="translate(60,100)">
    <rect width="680" height="80" rx="12" fill="#1a2438" stroke="#7aa2ff" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="20" y="28" fill="#7aa2ff" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="2">SCENARIO</text>
    <text x="20" y="52" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="14">A stakeholder demands a scope change mid-sprint. Two team members already started work.</text>
    <text x="20" y="70" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="14">What should the project manager do FIRST?</text>
  </g>

  <!-- 4 answer boxes -->
  <g transform="translate(60,210)">
    <rect width="320" height="100" rx="10" fill="#1a2438" stroke="#34d399" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="16" y="28" fill="#34d399" font-family="Inter, sans-serif" font-size="11" font-weight="700">A · DEFENSIBLE</text>
    <text x="16" y="52" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="13" font-weight="600">Reject the change request.</text>
    <text x="16" y="72" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">Protects sprint commitment.</text>
    <text x="16" y="88" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">But PMI wants you to assess first.</text>
  </g>
  <g transform="translate(420,210)">
    <rect width="320" height="100" rx="10" fill="#1a2438" stroke="#34d399" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="16" y="28" fill="#34d399" font-family="Inter, sans-serif" font-size="11" font-weight="700">B · DEFENSIBLE</text>
    <text x="16" y="52" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="13" font-weight="600">Escalate to the sponsor.</text>
    <text x="16" y="72" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">Stakeholder engagement is real.</text>
    <text x="16" y="88" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">But you skipped impact analysis.</text>
  </g>
  <g transform="translate(60,330)">
    <rect width="320" height="100" rx="10" fill="#1a2438" stroke="url(#brandGrad)" stroke-opacity="1" stroke-width="2.5"/>
    <defs>
      <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#7aa2ff"/>
        <stop offset="100%" stop-color="#a78bfa"/>
      </linearGradient>
    </defs>
    <text x="16" y="28" fill="#a78bfa" font-family="Inter, sans-serif" font-size="11" font-weight="700">C · BEST ANSWER</text>
    <text x="16" y="52" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="13" font-weight="600">Assess the impact, then convene.</text>
    <text x="16" y="72" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">PMI Decision Lens: data first,</text>
    <text x="16" y="88" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">then communicate with stakeholders.</text>
  </g>
  <g transform="translate(420,330)">
    <rect width="320" height="100" rx="10" fill="#1a2438" stroke="#34d399" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="16" y="28" fill="#34d399" font-family="Inter, sans-serif" font-size="11" font-weight="700">D · DEFENSIBLE</text>
    <text x="16" y="52" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="13" font-weight="600">Reassign the work, absorb cost.</text>
    <text x="16" y="72" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">Adaptive, customer-focused.</text>
    <text x="16" y="88" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">But you committed without data.</text>
  </g>

  <!-- Bottom claim -->
  <g transform="translate(60,460)">
    <text x="340" y="22" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Memorizing facts won't separate C from A, B, D.</text>
    <text x="340" y="48" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">The PMI Decision Lens names the rule that ranks them — "data, then communicate."</text>
    <text x="340" y="72" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">Illustrative scenario, not from any real exam.</text>
  </g>
</svg>
