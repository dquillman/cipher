<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-label="A four-week certification study plan split into diagnose, build coverage, simulate, and close gaps">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f1830"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" fill="url(#bgGrad)"/>
  <text x="400" y="44" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="22" font-weight="700" text-anchor="middle">A 30-day plan that compounds.</text>
  <text x="400" y="70" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">Each week's work makes the next week's work cheaper.</text>

  <!-- Timeline track -->
  <line x1="60" y1="140" x2="740" y2="140" stroke="#1a2438" stroke-width="3"/>

  <!-- Week 1 -->
  <g transform="translate(60,100)">
    <circle cx="80" cy="40" r="14" fill="#7aa2ff"/>
    <text x="80" y="46" fill="#0b1220" font-family="Inter, sans-serif" font-size="14" font-weight="800" text-anchor="middle">1</text>
    <text x="80" y="92" fill="#7aa2ff" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">WEEK 1</text>
  </g>
  <g transform="translate(60,210)">
    <rect x="0" y="0" width="160" height="240" rx="12" fill="#1a2438" stroke="#7aa2ff" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="80" y="32" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Diagnose</text>
    <text x="14" y="64" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">• 20-min cognitive</text>
    <text x="14" y="82" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">  baseline</text>
    <text x="14" y="106" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">• Domain weights</text>
    <text x="14" y="124" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">  audit</text>
    <text x="14" y="148" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">• Heatmap reveal:</text>
    <text x="14" y="166" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">  what's weak</text>
    <text x="14" y="200" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="11" font-style="italic">Outcome:</text>
    <text x="14" y="218" fill="#7aa2ff" font-family="Inter, sans-serif" font-size="12" font-weight="700">a precise gap list</text>
  </g>

  <!-- Week 2 -->
  <g transform="translate(230,100)">
    <circle cx="80" cy="40" r="14" fill="#a78bfa"/>
    <text x="80" y="46" fill="#0b1220" font-family="Inter, sans-serif" font-size="14" font-weight="800" text-anchor="middle">2</text>
    <text x="80" y="92" fill="#a78bfa" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">WEEK 2</text>
  </g>
  <g transform="translate(230,210)">
    <rect x="0" y="0" width="160" height="240" rx="12" fill="#1a2438" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="80" y="32" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Build coverage</text>
    <text x="14" y="64" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">• Daily 50-question</text>
    <text x="14" y="82" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">  practice mix</text>
    <text x="14" y="106" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">• Weighted to your</text>
    <text x="14" y="124" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">  weak domains</text>
    <text x="14" y="148" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">• Read explanations</text>
    <text x="14" y="166" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">  EVEN on right ones</text>
    <text x="14" y="200" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="11" font-style="italic">Outcome:</text>
    <text x="14" y="218" fill="#a78bfa" font-family="Inter, sans-serif" font-size="12" font-weight="700">domain fluency</text>
  </g>

  <!-- Week 3 -->
  <g transform="translate(400,100)">
    <circle cx="80" cy="40" r="14" fill="#fbbf24"/>
    <text x="80" y="46" fill="#0b1220" font-family="Inter, sans-serif" font-size="14" font-weight="800" text-anchor="middle">3</text>
    <text x="80" y="92" fill="#fbbf24" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">WEEK 3</text>
  </g>
  <g transform="translate(400,210)">
    <rect x="0" y="0" width="160" height="240" rx="12" fill="#1a2438" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="80" y="32" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Simulate</text>
    <text x="14" y="64" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">• Full mock at</text>
    <text x="14" y="82" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">  exam length</text>
    <text x="14" y="106" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">• Pacing is its own</text>
    <text x="14" y="124" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">  skill — train it</text>
    <text x="14" y="148" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">• Readiness report</text>
    <text x="14" y="166" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">  sets next focus</text>
    <text x="14" y="200" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="11" font-style="italic">Outcome:</text>
    <text x="14" y="218" fill="#fbbf24" font-family="Inter, sans-serif" font-size="12" font-weight="700">a real score signal</text>
  </g>

  <!-- Week 4 -->
  <g transform="translate(570,100)">
    <circle cx="80" cy="40" r="14" fill="#34d399"/>
    <text x="80" y="46" fill="#0b1220" font-family="Inter, sans-serif" font-size="14" font-weight="800" text-anchor="middle">4</text>
    <text x="80" y="92" fill="#34d399" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">WEEK 4</text>
  </g>
  <g transform="translate(570,210)">
    <rect x="0" y="0" width="160" height="240" rx="12" fill="#1a2438" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="80" y="32" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Close gaps</text>
    <text x="14" y="64" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">• Drill the worst</text>
    <text x="14" y="82" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">  3 trap patterns</text>
    <text x="14" y="106" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">• Second full mock</text>
    <text x="14" y="124" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">  day 25</text>
    <text x="14" y="148" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">• Light review</text>
    <text x="14" y="166" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12">  days 28-30</text>
    <text x="14" y="200" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="11" font-style="italic">Outcome:</text>
    <text x="14" y="218" fill="#34d399" font-family="Inter, sans-serif" font-size="12" font-weight="700">test-day confidence</text>
  </g>

  <text x="400" y="500" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Skip the diagnostic and weeks 2–4 are guessing. Skip the simulator and you find out test day.</text>
</svg>
