<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-label="Recognition vs production comparison">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f1830"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="hotGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>
  <rect width="800" height="380" fill="url(#bgGrad)"/>
  <text x="400" y="36" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Recognition ≠ Production</text>
<rect x="40" y="80" width="330" height="250" rx="12" fill="#17213a" stroke="#9fb0cc" stroke-opacity="0.3"/>
<text x="205" y="116" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle">RECOGNITION</text>
<text x="205" y="136" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">What flashcards train</text>
<text x="68" y="180" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="13">• See 4 options, pick 1</text>
<text x="68" y="210" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="13">• Answer is visible</text>
<text x="68" y="240" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="13">• Weaker cognitive skill</text>
<text x="68" y="270" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="13">• Easily defeated by distractors</text>
<text x="205" y="310" fill="#fbbf24" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Plateaus at ~70-75%</text>
<rect x="430" y="80" width="330" height="250" rx="12" fill="#17213a" stroke="#7aa2ff" stroke-opacity="0.6" stroke-width="1.5"/>
<text x="595" y="116" fill="#7aa2ff" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle">PRODUCTION</text>
<text x="595" y="136" fill="#9fb0cc" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">What the exam actually tests</text>
<text x="458" y="180" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="13">• Generate reasoning from scratch</text>
<text x="458" y="210" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="13">• Options are traps</text>
<text x="458" y="240" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="13">• Stronger cognitive skill</text>
<text x="458" y="270" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="13">• Survives distractor pressure</text>
<text x="595" y="310" fill="#34d399" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Scales past 90%</text>
</svg>