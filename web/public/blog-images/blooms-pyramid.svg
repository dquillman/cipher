  <rect width="800" height="560" fill="url(#bgGrad)"/>
  <text x="400" y="42" fill="#e5ecf7" font-family="Inter, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Bloom's Taxonomy — the framework behind your exam</text>
<polygon points="350.0,90.0 450.0,90.0 495.0,154.33333333333331 305.0,154.33333333333331" fill="#f87171" fill-opacity="0.18" stroke="#f87171" stroke-width="1.5"/>
