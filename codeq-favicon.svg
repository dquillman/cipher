<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="40" fill="url(#bg)"/>
  <!-- Code brackets -->
  <text x="20" y="200" font-family="Courier New, monospace" font-size="120" font-weight="700" fill="#334155">&lt;</text>
  <text x="220" y="200" font-family="Courier New, monospace" font-size="120" font-weight="700" fill="#334155">/&gt;</text>
  <!-- Q letter -->
  <text x="88" y="210" font-family="Arial Black, sans-serif" font-size="180" font-weight="900" fill="url(#accent)">Q</text>
  <!-- Circuit lines -->
  <line x1="30" y1="40" x2="80" y2="40" stroke="#6366f1" stroke-width="2" opacity="0.5"/>
  <circle cx="80" cy="40" r="4" fill="#6366f1" opacity="0.5"/>
  <line x1="220" y1="40" x2="270" y2="40" stroke="#6366f1" stroke-width="2" opacity="0.5"/>
  <circle cx="220" cy="40" r="4" fill="#6366f1" opacity="0.5"/>
  <line x1="30" y1="260" x2="60" y2="260" stroke="#818cf8" stroke-width="2" opacity="0.4"/>
  <circle cx="60" cy="260" r="3" fill="#818cf8" opacity="0.4"/>
  <line x1="240" y1="260" x2="270" y2="260" stroke="#818cf8" stroke-width="2" opacity="0.4"/>
  <circle cx="240" cy="260" r="3" fill="#818cf8" opacity="0.4"/>
  <!-- Cursor blink -->
  <rect x="245" y="130" width="8" height="50" rx="2" fill="#fbbf24" opacity="0.8"/>
</svg>