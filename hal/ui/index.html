<!DOCTYPE html>
<html lang="en" data-skin="jarvis">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>H.A.L. // JARVIS Interface</title>
<style>
  :root{
    --bg:#04070d; --bg2:#0a1622; --panel:rgba(10,22,34,.6);
    --accent:#35e0ff; --accent-soft:#35e0ff33; --accent-dim:#35e0ff22;
    --text:#dff3ff; --muted:#6f93a8; --you:#ffd67a; --danger:#ff5c5c;
    --ring:#35e0ff; --font:"Segoe UI",system-ui,-apple-system,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  html[data-skin="hal"]{
    --bg:#0a0303; --bg2:#1a0606; --panel:rgba(30,6,6,.6);
    --accent:#ff2b2b; --accent-soft:#ff2b2b33; --accent-dim:#ff2b2b22;
    --text:#ffe2e2; --muted:#a86f6f; --you:#ffb27a; --ring:#ff2b2b;
  }
  html[data-skin="minimal"]{
    --bg:#f6f8fb; --bg2:#eef2f7; --panel:#ffffff;
    --accent:#2563eb; --accent-soft:#2563eb22; --accent-dim:#2563eb14;
    --text:#0f1b2d; --muted:#5b6b7e; --you:#b45309; --ring:#2563eb;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:var(--font); color:var(--text);
    background:radial-gradient(1200px 800px at 50% -10%,var(--bg2),var(--bg)) fixed;
    display:flex; flex-direction:column; overflow:hidden;
  }
  html[data-skin="minimal"] body{background:var(--bg)}

  /* top bar */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; border-bottom:1px solid var(--accent-dim);
    backdrop-filter:blur(6px);
  }
  .brand{display:flex; align-items:baseline; gap:12px}
  .brand h1{margin:0; font-size:20px; letter-spacing:.32em; font-weight:700}
  .brand .sub{font-family:var(--mono); font-size:11px; letter-spacing:.28em; color:var(--muted)}
  .controls{display:flex; align-items:center; gap:10px}
  .seg{display:flex; border:1px solid var(--accent-dim); border-radius:999px; overflow:hidden}
  .seg button{
    background:transparent; color:var(--muted); border:0; cursor:pointer;
    font-family:var(--mono); font-size:11px; letter-spacing:.12em; padding:7px 12px;
    transition:.15s;
  }
  .seg button[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent)}
  .seg button:hover{color:var(--text)}
  .toggle{
    background:transparent; border:1px solid var(--accent-dim); color:var(--muted);
    border-radius:999px; padding:7px 12px; cursor:pointer; font-family:var(--mono);
    font-size:11px; letter-spacing:.12em;
  }
  .toggle[aria-pressed="true"]{color:var(--accent); border-color:var(--accent-soft)}

  /* core + transcript */
  main{flex:1; display:flex; min-height:0}
  .stage{
    width:320px; flex-shrink:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:22px; padding:24px;
    border-right:1px solid var(--accent-dim);
  }
  .reactor{width:220px; height:220px; position:relative}
  .reactor svg{width:100%; height:100%; overflow:visible}
  .reactor .r{fill:none; stroke:var(--ring); transform-origin:110px 110px}
  .reactor .core{fill:var(--ring)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinrev{to{transform:rotate(-360deg)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  .reactor .r1{animation:spin 18s linear infinite; opacity:.5}
  .reactor .r2{animation:spinrev 12s linear infinite; opacity:.4}
  .reactor .r3{animation:spin 7s linear infinite; opacity:.7}
  .reactor .glow{filter:drop-shadow(0 0 10px var(--ring)) drop-shadow(0 0 26px var(--ring))}
  body.thinking .reactor .r1{animation-duration:5s}
  body.thinking .reactor .r2{animation-duration:3.5s}
  body.thinking .reactor .r3{animation-duration:2s}
  body.thinking .reactor .core,body.speaking .reactor .core{animation:pulse 1s ease-in-out infinite}
  .status{font-family:var(--mono); font-size:11px; letter-spacing:.18em; color:var(--muted); text-align:center; text-transform:uppercase}
  .status b{color:var(--accent); font-weight:600}
  .statebadge{
    font-family:var(--mono); font-size:11px; letter-spacing:.2em; color:var(--accent);
    border:1px solid var(--accent-soft); border-radius:999px; padding:5px 14px; min-width:120px; text-align:center;
  }

  .chatwrap{flex:1; display:flex; flex-direction:column; min-width:0}
  #log{flex:1; overflow-y:auto; padding:24px 28px; display:flex; flex-direction:column; gap:14px; scroll-behavior:smooth}
  #log::-webkit-scrollbar{width:8px}
  #log::-webkit-scrollbar-thumb{background:var(--accent-dim); border-radius:8px}
  .msg{max-width:760px; line-height:1.55; font-size:15px; white-space:pre-wrap; word-wrap:break-word}
  .msg .who{font-family:var(--mono); font-size:10px; letter-spacing:.24em; text-transform:uppercase; display:block; margin-bottom:4px; color:var(--muted)}
  .msg.you{align-self:flex-end; text-align:right}
  .msg.you .who{color:var(--you)}
  .msg.you .body{color:var(--you)}
  .msg.hal .who{color:var(--accent)}
  .msg.hal .body{
    border-left:2px solid var(--accent-soft); padding-left:14px;
  }
  html[data-skin="minimal"] .msg.hal .body{border-left-color:var(--accent)}
  .sys{align-self:flex-start; font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:var(--muted); display:flex; align-items:center; gap:8px}
  .sys .dot{width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent)}
  .sys.err{color:var(--danger)} .sys.err .dot{background:var(--danger); box-shadow:0 0 8px var(--danger)}
  .cursor{display:inline-block; width:8px; margin-left:1px; background:var(--accent); animation:pulse 1s steps(2) infinite}

  /* input */
  footer{padding:16px 24px; border-top:1px solid var(--accent-dim)}
  .inrow{display:flex; gap:10px; align-items:flex-end; max-width:1000px; margin:0 auto}
  #input{
    flex:1; resize:none; min-height:48px; max-height:160px; padding:13px 16px;
    background:var(--panel); border:1px solid var(--accent-dim); border-radius:12px;
    color:var(--text); font-family:var(--font); font-size:15px; outline:none;
  }
  #input:focus{border-color:var(--accent-soft); box-shadow:0 0 0 3px var(--accent-dim)}
  .iconbtn{
    height:48px; min-width:48px; padding:0 16px; border-radius:12px; cursor:pointer;
    border:1px solid var(--accent-dim); background:var(--panel); color:var(--accent);
    font-family:var(--mono); font-size:13px; letter-spacing:.08em; transition:.15s;
  }
  .iconbtn:hover{border-color:var(--accent); box-shadow:0 0 14px var(--accent-dim)}
  .iconbtn.send{background:var(--accent-soft)}
  .iconbtn.rec{color:var(--danger); border-color:var(--danger)}
  .hint{max-width:1000px; margin:8px auto 0; font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--muted)}

  @media (max-width:820px){
    .stage{display:none}
  }
</style>
</head>
<body class="idle">
  <header>
    <div class="brand">
      <h1>H.A.L.</h1><span class="sub" id="brandsub">JARVIS INTERFACE</span>
    </div>
    <div class="controls">
      <div class="seg" id="skins" role="group" aria-label="Interface skin">
        <button data-skin="jarvis" aria-pressed="true">JARVIS</button>
        <button data-skin="hal" aria-pressed="false">HAL 9000</button>
        <button data-skin="minimal" aria-pressed="false">MINIMAL</button>
      </div>
      <button class="toggle" id="micToggle" aria-pressed="false" title="Voice input (speech-to-text)">🎙 VOICE</button>
      <button class="toggle" id="speakToggle" aria-pressed="false" title="Speak replies aloud">🔊 SPEAK</button>
    </div>
  </header>

  <main>
    <aside class="stage">
      <div class="reactor glow" aria-hidden="true">
        <svg viewBox="0 0 220 220">
          <circle class="r r1" cx="110" cy="110" r="96" stroke-width="1.5" stroke-dasharray="14 10"/>
          <circle class="r r2" cx="110" cy="110" r="78" stroke-width="2" stroke-dasharray="4 12"/>
          <circle class="r r3" cx="110" cy="110" r="58" stroke-width="1.5" stroke-dasharray="40 18"/>
          <circle class="r" cx="110" cy="110" r="40" stroke-width="1" opacity=".3"/>
          <circle class="core" cx="110" cy="110" r="16"/>
        </svg>
      </div>
      <div class="statebadge" id="statebadge">STANDBY</div>
      <div class="status" id="status">brain: <b id="brainpath">—</b><br/>model: <b id="model">—</b></div>
    </aside>

    <section class="chatwrap">
      <div id="log"></div>
    </section>
  </main>

  <footer>
    <div class="inrow">
      <textarea id="input" placeholder="Speak to HAL…  (Enter to send, Shift+Enter for a new line)"></textarea>
      <button class="iconbtn" id="micBtn" title="Hold-free dictation">🎙</button>
      <button class="iconbtn send" id="sendBtn">SEND ▸</button>
    </div>
    <div class="hint">Ask about your notes · say "log …" or "save … as a note" to capture · switch skins top-right</div>
  </footer>

<script>
const $ = s => document.querySelector(s);
const log = $("#log");
let busy = false;

// ---- skins ----------------------------------------------------------
const SUBTITLE = {jarvis:"JARVIS INTERFACE", hal:"HAL 9000 INTERFACE", minimal:"MINIMAL INTERFACE"};
function setSkin(skin){
  document.documentElement.dataset.skin = skin;
  $("#brandsub").textContent = SUBTITLE[skin] || "INTERFACE";
  document.querySelectorAll("#skins button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.skin === skin)));
  try{ localStorage.setItem("hal.skin", skin); }catch(e){}
}
document.querySelectorAll("#skins button").forEach(b =>
  b.addEventListener("click", () => setSkin(b.dataset.skin)));
setSkin((()=>{ try{ return localStorage.getItem("hal.skin") || "jarvis"; }catch(e){ return "jarvis"; }})());

// ---- reactor state --------------------------------------------------
function setState(state){ // idle | thinking | speaking
  document.body.className = state;
  const labels = {idle:"STANDBY", thinking:"PROCESSING", speaking:"RESPONDING"};
  $("#statebadge").textContent = labels[state] || "STANDBY";
}

// ---- transcript -----------------------------------------------------
function addMsg(who, text){
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.innerHTML = `<span class="who">${who === "you" ? "you" : "HAL"}</span><span class="body"></span>`;
  el.querySelector(".body").textContent = text;
  log.appendChild(el); scroll();
  return el.querySelector(".body");
}
function addSys(text, isErr){
  const el = document.createElement("div");
  el.className = "sys" + (isErr ? " err" : "");
  el.innerHTML = `<span class="dot"></span><span></span>`;
  el.querySelector("span:last-child").textContent = text;
  log.appendChild(el); scroll();
}
function scroll(){ log.scrollTop = log.scrollHeight; }

// ---- speech synthesis ----------------------------------------------
let speak = false;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  return vs.find(v => /google uk english male|daniel|arthur/i.test(v.name))
      || vs.find(v => /en-GB/i.test(v.lang)) || vs.find(v => /en/i.test(v.lang)) || vs[0];
}
function say(text){
  if(!speak || !("speechSynthesis" in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(); if(v) u.voice = v;
  u.rate = 1.02; u.pitch = 0.9;
  u.onstart = () => setState("speaking");
  u.onend = () => setState("idle");
  speechSynthesis.speak(u);
}
$("#speakToggle").addEventListener("click", e => {
  speak = !speak; e.currentTarget.setAttribute("aria-pressed", String(speak));
  if(!speak) speechSynthesis.cancel();
});

// ---- speech recognition (voice input) ------------------------------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
if(SR){
  rec = new SR(); rec.lang = "en-US"; rec.interimResults = true; rec.continuous = false;
  let finalText = "";
  rec.onresult = e => {
    let interim = ""; finalText = "";
    for(const r of e.results){ (r.isFinal ? (finalText += r[0].transcript) : (interim += r[0].transcript)); }
    $("#input").value = (finalText || interim).trim();
  };
  rec.onend = () => { setListening(false); if($("#input").value.trim()) send(); };
  rec.onerror = () => setListening(false);
}
function setListening(on){
  listening = on;
  $("#micToggle").setAttribute("aria-pressed", String(on));
  $("#micBtn").classList.toggle("rec", on);
  $("#micBtn").textContent = on ? "◉" : "🎙";
}
function toggleMic(){
  if(!rec){ addSys("Voice input isn't supported in this browser.", true); return; }
  if(listening){ rec.stop(); return; }
  try{ $("#input").value = ""; rec.start(); setListening(true); }catch(e){ setListening(false); }
}
$("#micBtn").addEventListener("click", toggleMic);
$("#micToggle").addEventListener("click", toggleMic);

// ---- sending & streaming -------------------------------------------
async function send(){
  const input = $("#input");
  const text = input.value.trim();
  if(!text || busy) return;
  input.value = "";
  addMsg("you", text);
  busy = true; setState("thinking");

  let body = null, acc = "";
  try{
    const res = await fetch("/api/chat", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({message:text}),
    });
    if(!res.ok || !res.body){ addSys("HAL is unreachable ("+res.status+").", true); return; }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while(true){
      const {value, done} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      let nl;
      while((nl = buf.indexOf("\n")) >= 0){
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl+1);
        if(!line) continue;
        let ev; try{ ev = JSON.parse(line); }catch(e){ continue; }
        if(ev.type === "tool_use"){
          addSys("consulting the brain · " + ev.name + " …");
        }else if(ev.type === "tool_result"){
          addSys((ev.is_error ? "brain error · " : "") + ev.name + ": " + ev.summary, ev.is_error);
        }else if(ev.type === "text"){
          if(!body){ body = addMsg("hal", ""); }
          acc += ev.text; body.textContent = acc; scroll();
        }else if(ev.type === "error"){
          addSys(ev.message, true);
        }else if(ev.type === "final"){
          if(ev.text) say(ev.text);
        }
      }
    }
  }catch(e){
    addSys("connection lost: " + e.message, true);
  }finally{
    busy = false;
    if(document.body.className !== "speaking") setState("idle");
  }
}
$("#sendBtn").addEventListener("click", send);
$("#input").addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});

// ---- boot -----------------------------------------------------------
(async function init(){
  try{
    const s = await (await fetch("/api/state")).json();
    $("#brainpath").textContent = (s.brain && s.brain.root) ? s.brain.root.replace(/^.*[\\/]/, "…/") + "" : "—";
    $("#brainpath").title = s.brain ? s.brain.root : "";
    $("#model").textContent = s.model || "—";
    const n = s.brain ? s.brain.notes : 0;
    addSys(`online · ${n} note${n===1?"":"s"} in the brain · ${s.model}`);
  }catch(e){ addSys("could not reach the brain backend", true); }
  // Prime voices list (some browsers load them async).
  if("speechSynthesis" in window){ speechSynthesis.onvoiceschanged = pickVoice; pickVoice(); }
  $("#input").focus();
})();
</script>
</body>
</html>
