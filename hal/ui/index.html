<!DOCTYPE html>
<html lang="en" data-skin="jarvis">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>H.A.L. // JARVIS Interface</title>
<style>
  :root{
    --bg:#04070d; --bg2:#0a1622; --panel:rgba(10,22,34,.6);
    --accent:#35e0ff; --accent-soft:#35e0ff33; --accent-dim:#35e0ff22;
    --text:#dff3ff; --muted:#6f93a8; --you:#ffd67a; --danger:#ff5c5c;
    --ring:#35e0ff; --font:"Segoe UI",system-ui,-apple-system,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  html[data-skin="hal"]{
    --bg:#0a0303; --bg2:#1a0606; --panel:rgba(30,6,6,.6);
    --accent:#ff2b2b; --accent-soft:#ff2b2b33; --accent-dim:#ff2b2b22;
    --text:#ffe2e2; --muted:#a86f6f; --you:#ffb27a; --ring:#ff2b2b;
  }
  html[data-skin="minimal"]{
    --bg:#f6f8fb; --bg2:#eef2f7; --panel:#ffffff;
    --accent:#2563eb; --accent-soft:#2563eb22; --accent-dim:#2563eb14;
    --text:#0f1b2d; --muted:#5b6b7e; --you:#b45309; --ring:#2563eb;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:var(--font); color:var(--text);
    background:radial-gradient(1200px 800px at 50% -10%,var(--bg2),var(--bg)) fixed;
    display:flex; flex-direction:column; overflow:hidden;
  }
  html[data-skin="minimal"] body{background:var(--bg)}

  header{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px 18px; border-bottom:1px solid var(--accent-dim); backdrop-filter:blur(6px);
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:baseline; gap:12px}
  .brand h1{margin:0; font-size:20px; letter-spacing:.32em; font-weight:700}
  .brand .sub{font-family:var(--mono); font-size:11px; letter-spacing:.28em; color:var(--muted)}
  .controls{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .seg{display:flex; border:1px solid var(--accent-dim); border-radius:999px; overflow:hidden}
  .seg button{
    background:transparent; color:var(--muted); border:0; cursor:pointer;
    font-family:var(--mono); font-size:11px; letter-spacing:.12em; padding:7px 12px; transition:.15s;
  }
  .seg button[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent)}
  .seg button:hover{color:var(--text)}
  select#model{
    background:var(--panel); color:var(--accent); border:1px solid var(--accent-dim);
    border-radius:999px; padding:7px 12px; font-family:var(--mono); font-size:11px;
    letter-spacing:.08em; cursor:pointer; outline:none;
  }
  .toggle{
    background:transparent; border:1px solid var(--accent-dim); color:var(--muted);
    border-radius:999px; padding:7px 12px; cursor:pointer; font-family:var(--mono);
    font-size:11px; letter-spacing:.12em;
  }
  .toggle[aria-pressed="true"]{color:var(--accent); border-color:var(--accent-soft)}

  main{flex:1; display:flex; min-height:0; position:relative}

  /* chat view */
  .stage{
    width:300px; flex-shrink:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:20px; padding:22px;
    border-right:1px solid var(--accent-dim);
  }
  .reactor{width:200px; height:200px; position:relative}
  .reactor svg{width:100%; height:100%; overflow:visible}
  .reactor .r{fill:none; stroke:var(--ring); transform-origin:110px 110px}
  .reactor .core{fill:var(--ring)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinrev{to{transform:rotate(-360deg)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  .reactor .r1{animation:spin 18s linear infinite; opacity:.5}
  .reactor .r2{animation:spinrev 12s linear infinite; opacity:.4}
  .reactor .r3{animation:spin 7s linear infinite; opacity:.7}
  .reactor .glow{filter:drop-shadow(0 0 10px var(--ring)) drop-shadow(0 0 26px var(--ring))}
  body.thinking .reactor .r1{animation-duration:5s}
  body.thinking .reactor .r2{animation-duration:3.5s}
  body.thinking .reactor .r3{animation-duration:2s}
  body.thinking .reactor .core,body.speaking .reactor .core{animation:pulse 1s ease-in-out infinite}
  .status{font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:var(--muted); text-align:center; text-transform:uppercase}
  .status b{color:var(--accent); font-weight:600}
  .statebadge{font-family:var(--mono); font-size:11px; letter-spacing:.2em; color:var(--accent);
    border:1px solid var(--accent-soft); border-radius:999px; padding:5px 14px; min-width:120px; text-align:center}

  .chatwrap{flex:1; display:flex; flex-direction:column; min-width:0}
  #log{flex:1; overflow-y:auto; padding:22px 26px; display:flex; flex-direction:column; gap:14px}
  #log::-webkit-scrollbar{width:8px}
  #log::-webkit-scrollbar-thumb{background:var(--accent-dim); border-radius:8px}
  .msg{max-width:760px; line-height:1.55; font-size:15px; white-space:pre-wrap; word-wrap:break-word}
  .msg .who{font-family:var(--mono); font-size:10px; letter-spacing:.24em; text-transform:uppercase; display:block; margin-bottom:4px; color:var(--muted)}
  .msg.you{align-self:flex-end; text-align:right}
  .msg.you .who{color:var(--you)} .msg.you .body{color:var(--you)}
  .msg.hal .who{color:var(--accent)}
  .msg.hal .body{border-left:2px solid var(--accent-soft); padding-left:14px}
  html[data-skin="minimal"] .msg.hal .body{border-left-color:var(--accent)}
  .sys{align-self:flex-start; font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:var(--muted); display:flex; align-items:center; gap:8px}
  .sys .dot{width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent)}
  .sys.err{color:var(--danger)} .sys.err .dot{background:var(--danger); box-shadow:0 0 8px var(--danger)}

  footer{padding:14px 22px; border-top:1px solid var(--accent-dim)}
  .inrow{display:flex; gap:10px; align-items:flex-end; max-width:1000px; margin:0 auto}
  #input{flex:1; resize:none; min-height:48px; max-height:160px; padding:13px 16px;
    background:var(--panel); border:1px solid var(--accent-dim); border-radius:12px;
    color:var(--text); font-family:var(--font); font-size:15px; outline:none}
  #input:focus{border-color:var(--accent-soft); box-shadow:0 0 0 3px var(--accent-dim)}
  .iconbtn{height:48px; min-width:48px; padding:0 16px; border-radius:12px; cursor:pointer;
    border:1px solid var(--accent-dim); background:var(--panel); color:var(--accent);
    font-family:var(--mono); font-size:13px; letter-spacing:.08em; transition:.15s}
  .iconbtn:hover{border-color:var(--accent); box-shadow:0 0 14px var(--accent-dim)}
  .iconbtn.send{background:var(--accent-soft)}
  .iconbtn.rec{color:var(--danger); border-color:var(--danger)}
  .hint{max-width:1000px; margin:8px auto 0; font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--muted)}

  /* brain (3D) view */
  .brainview{position:absolute; inset:0; display:none}
  #graph{position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab}
  #graph:active{cursor:grabbing}
  .glabel{position:absolute; top:16px; left:20px; font-family:var(--mono); font-size:11px;
    letter-spacing:.16em; color:var(--muted); text-transform:uppercase; pointer-events:none}
  .glabel b{color:var(--accent)}
  .gtip{position:absolute; pointer-events:none; padding:5px 9px; font-family:var(--mono); font-size:11px;
    color:var(--text); background:var(--panel); border:1px solid var(--accent-soft); border-radius:8px;
    transform:translate(12px,12px); display:none; max-width:320px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .gcontrols{position:absolute; top:14px; right:18px; display:flex; gap:8px}
  #preview{position:absolute; bottom:18px; left:18px; width:min(420px,44vw); max-height:46%;
    background:var(--panel); border:1px solid var(--accent-soft); border-radius:12px; padding:14px 16px;
    display:none; flex-direction:column; gap:10px; backdrop-filter:blur(8px)}
  #preview h3{margin:0; font-family:var(--mono); font-size:12px; letter-spacing:.1em; color:var(--accent); word-break:break-all}
  #preview .pv-body{overflow:auto; font-size:13px; line-height:1.5; white-space:pre-wrap; color:var(--text); max-height:220px}
  #preview .pv-actions{display:flex; gap:8px}
  #preview button{font-family:var(--mono); font-size:11px; letter-spacing:.08em; cursor:pointer;
    border:1px solid var(--accent-dim); background:transparent; color:var(--accent); border-radius:8px; padding:7px 11px}
  #preview button:hover{border-color:var(--accent)}
  #preview .pv-close{position:absolute; top:8px; right:10px; color:var(--muted); border:0; background:transparent; font-size:16px; padding:2px 6px}

  body.view-brain .stage,body.view-brain .chatwrap,body.view-brain footer{display:none}
  body.view-brain .brainview{display:block}

  @media (max-width:820px){ .stage{display:none} }
</style>
</head>
<body class="idle view-chat">
  <header>
    <div class="brand"><h1>H.A.L.</h1><span class="sub" id="brandsub">JARVIS INTERFACE</span></div>
    <div class="controls">
      <div class="seg" id="views" role="group" aria-label="View">
        <button data-view="chat" aria-pressed="true">CHAT</button>
        <button data-view="brain" aria-pressed="false">BRAIN 3D</button>
      </div>
      <select id="model" title="Model"></select>
      <div class="seg" id="skins" role="group" aria-label="Skin">
        <button data-skin="jarvis" aria-pressed="true">JARVIS</button>
        <button data-skin="hal" aria-pressed="false">HAL 9000</button>
        <button data-skin="minimal" aria-pressed="false">MINIMAL</button>
      </div>
      <button class="toggle" id="micToggle" aria-pressed="false" title="Voice input">🎙 VOICE</button>
      <button class="toggle" id="speakToggle" aria-pressed="false" title="Speak replies">🔊 SPEAK</button>
    </div>
  </header>

  <main>
    <aside class="stage">
      <div class="reactor glow" aria-hidden="true">
        <svg viewBox="0 0 220 220">
          <circle class="r r1" cx="110" cy="110" r="96" stroke-width="1.5" stroke-dasharray="14 10"/>
          <circle class="r r2" cx="110" cy="110" r="78" stroke-width="2" stroke-dasharray="4 12"/>
          <circle class="r r3" cx="110" cy="110" r="58" stroke-width="1.5" stroke-dasharray="40 18"/>
          <circle class="r" cx="110" cy="110" r="40" stroke-width="1" opacity=".3"/>
          <circle class="core" cx="110" cy="110" r="16"/>
        </svg>
      </div>
      <div class="statebadge" id="statebadge">STANDBY</div>
      <div class="status" id="status">brain: <b id="brainpath">—</b><br/>model: <b id="modelName">—</b></div>
    </aside>

    <section class="chatwrap"><div id="log"></div></section>

    <section class="brainview">
      <canvas id="graph"></canvas>
      <div class="glabel" id="glabel">BRAIN MAP</div>
      <div class="gcontrols">
        <button class="toggle" id="autorotate" aria-pressed="true">⟳ ROTATE</button>
        <button class="toggle" id="refreshGraph">↺ REBUILD</button>
      </div>
      <div class="gtip" id="gtip"></div>
      <div id="preview">
        <button class="pv-close" id="pvClose">×</button>
        <h3 id="pvTitle"></h3>
        <div class="pv-body" id="pvBody"></div>
        <div class="pv-actions">
          <button id="pvAsk">Ask HAL about this</button>
          <button id="pvOpen">Open full read</button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="inrow">
      <textarea id="input" placeholder="Speak to HAL…  (Enter to send, Shift+Enter for a new line)"></textarea>
      <button class="iconbtn" id="micBtn" title="Dictation">🎙</button>
      <button class="iconbtn send" id="sendBtn">SEND ▸</button>
    </div>
    <div class="hint">Ask about your notes · say "log …" or "save … as a note" to capture · switch model & skin top-right · BRAIN 3D maps your notes</div>
  </footer>

<script>
const $ = s => document.querySelector(s);
const log = $("#log");
let busy = false, STATE = null;

// ---- skins ----------------------------------------------------------
const SUBTITLE = {jarvis:"JARVIS INTERFACE", hal:"HAL 9000 INTERFACE", minimal:"MINIMAL INTERFACE"};
function setSkin(skin){
  document.documentElement.dataset.skin = skin;
  $("#brandsub").textContent = SUBTITLE[skin] || "INTERFACE";
  document.querySelectorAll("#skins button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.skin===skin)));
  try{ localStorage.setItem("hal.skin", skin); }catch(e){}
}
document.querySelectorAll("#skins button").forEach(b => b.addEventListener("click", () => setSkin(b.dataset.skin)));
setSkin((()=>{ try{ return localStorage.getItem("hal.skin")||"jarvis"; }catch(e){ return "jarvis"; }})());

// ---- reactor state --------------------------------------------------
function setState(state){
  document.body.classList.remove("idle","thinking","speaking");
  document.body.classList.add(state);
  $("#statebadge").textContent = {idle:"STANDBY",thinking:"PROCESSING",speaking:"RESPONDING"}[state]||"STANDBY";
}

// ---- transcript -----------------------------------------------------
function addMsg(who, text){
  const el = document.createElement("div"); el.className = "msg " + who;
  el.innerHTML = `<span class="who">${who==="you"?"you":"HAL"}</span><span class="body"></span>`;
  el.querySelector(".body").textContent = text; log.appendChild(el); scroll();
  return el.querySelector(".body");
}
function addSys(text, isErr){
  const el = document.createElement("div"); el.className = "sys" + (isErr?" err":"");
  el.innerHTML = `<span class="dot"></span><span></span>`;
  el.querySelector("span:last-child").textContent = text; log.appendChild(el); scroll();
}
function scroll(){ log.scrollTop = log.scrollHeight; }

// ---- model switching ------------------------------------------------
async function setModel(id, announce){
  try{
    const r = await fetch("/api/model",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:id})});
    const j = await r.json();
    if(j.model){ $("#modelName").textContent = j.model; $("#model").value = j.model;
      if(announce) addSys("model switched to " + j.model); }
  }catch(e){ addSys("could not switch model: " + e.message, true); }
}
$("#model").addEventListener("change", e => setModel(e.target.value, true));

// ---- speech ---------------------------------------------------------
let speak = false;
function pickVoice(){ const vs=speechSynthesis.getVoices();
  return vs.find(v=>/google uk english male|daniel|arthur/i.test(v.name))||vs.find(v=>/en-GB/i.test(v.lang))||vs.find(v=>/en/i.test(v.lang))||vs[0]; }
function say(text){ if(!speak||!("speechSynthesis" in window)||!text) return;
  speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); const v=pickVoice(); if(v)u.voice=v;
  u.rate=1.02; u.pitch=0.9; u.onstart=()=>setState("speaking"); u.onend=()=>setState("idle"); speechSynthesis.speak(u); }
$("#speakToggle").addEventListener("click", e=>{ speak=!speak; e.currentTarget.setAttribute("aria-pressed",String(speak)); if(!speak)speechSynthesis.cancel(); });

const SR = window.SpeechRecognition||window.webkitSpeechRecognition; let rec=null, listening=false;
if(SR){ rec=new SR(); rec.lang="en-US"; rec.interimResults=true; rec.continuous=false;
  rec.onresult=e=>{ let interim="",final=""; for(const r of e.results){ r.isFinal?(final+=r[0].transcript):(interim+=r[0].transcript);} $("#input").value=(final||interim).trim(); };
  rec.onend=()=>{ setListening(false); if($("#input").value.trim()) send(); }; rec.onerror=()=>setListening(false); }
function setListening(on){ listening=on; $("#micToggle").setAttribute("aria-pressed",String(on)); $("#micBtn").classList.toggle("rec",on); $("#micBtn").textContent=on?"◉":"🎙"; }
function toggleMic(){ if(!rec){ addSys("Voice input isn't supported in this browser.",true); return; }
  if(listening){ rec.stop(); return; } try{ $("#input").value=""; rec.start(); setListening(true);}catch(e){ setListening(false);} }
$("#micBtn").addEventListener("click", toggleMic); $("#micToggle").addEventListener("click", toggleMic);

// ---- chat streaming -------------------------------------------------
async function send(){
  const input=$("#input"); const text=input.value.trim(); if(!text||busy) return;
  input.value=""; addMsg("you",text); busy=true; setState("thinking");
  let body=null, acc="";
  try{
    const res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text})});
    if(!res.ok||!res.body){ addSys("HAL is unreachable ("+res.status+").",true); return; }
    const reader=res.body.getReader(), dec=new TextDecoder(); let buf="";
    while(true){ const {value,done}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true}); let nl;
      while((nl=buf.indexOf("\n"))>=0){ const line=buf.slice(0,nl).trim(); buf=buf.slice(nl+1); if(!line) continue;
        let ev; try{ ev=JSON.parse(line); }catch(e){ continue; }
        if(ev.type==="tool_use") addSys("consulting the brain · "+ev.name+" …");
        else if(ev.type==="tool_result") addSys((ev.is_error?"brain error · ":"")+ev.name+": "+ev.summary, ev.is_error);
        else if(ev.type==="text"){ if(!body) body=addMsg("hal",""); acc+=ev.text; body.textContent=acc; scroll(); }
        else if(ev.type==="error") addSys(ev.message,true);
        else if(ev.type==="final"){ if(ev.text) say(ev.text); }
      }
    }
  }catch(e){ addSys("connection lost: "+e.message,true); }
  finally{ busy=false; if(!document.body.classList.contains("speaking")) setState("idle"); }
}
$("#sendBtn").addEventListener("click", send);
$("#input").addEventListener("keydown", e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send(); } });

// ---- view switching -------------------------------------------------
function setView(view){
  document.body.classList.toggle("view-brain", view==="brain");
  document.body.classList.toggle("view-chat", view==="chat");
  document.querySelectorAll("#views button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.view===view)));
  if(view==="brain"){ Graph.enter(); } else { Graph.leave(); $("#input").focus(); }
}
document.querySelectorAll("#views button").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.view)));

// ================= 3D BRAIN GRAPH ===================================
const Graph = (function(){
  const cv=$("#graph"); const ctx=cv.getContext("2d");
  let W=0,H=0,DPR=1;
  let nodes=[], edges=[], byId={}, loaded=false, raf=0, fitted=false;
  let yaw=0.5, pitch=-0.35, zoom=1.5, dist=200, alpha=1;
  let autorotate=true, dragging=false, lastX=0, lastY=0, moved=0;
  let hover=null, selected=null;

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=cv.clientWidth; H=cv.clientHeight;
    cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  function hue(group){ let h=0; for(const c of (group||"root")) h=(h*31+c.charCodeAt(0))%360; return h; }
  function colorFor(n, a){ const hd=hue(n.group); return `hsla(${hd},80%,${n.type==="folder"?58:64}%,${a})`; }

  async function load(force){
    if(loaded && !force) return;
    $("#glabel").innerHTML="BRAIN MAP · <b>loading…</b>";
    try{
      const g=await (await fetch("/api/graph")).json();
      if(g.error){ $("#glabel").innerHTML="BRAIN MAP · <b>error</b>"; return; }
      byId={}; nodes=g.nodes.map((n,i)=>{ const a=Math.acos(1-2*(i+.5)/g.nodes.length), b=Math.PI*(1+Math.sqrt(5))*i, R=210;
        const nn=Object.assign({},n,{x:R*Math.sin(a)*Math.cos(b),y:R*Math.sin(a)*Math.sin(b),z:R*Math.cos(a),vx:0,vy:0,vz:0}); byId[n.id]=nn; return nn; });
      edges=g.edges.filter(e=>byId[e.source]&&byId[e.target]);
      loaded=true; alpha=1; fitted=false;
      const c=g.counts||{}; $("#glabel").innerHTML=`BRAIN MAP · <b>${c.notes||0}</b> notes · <b>${c.folders||0}</b> folders · <b>${c.edges||0}</b> links`+(g.truncated?" (capped)":"");
    }catch(e){ $("#glabel").innerHTML="BRAIN MAP · <b>backend unreachable</b>"; }
  }

  function physics(){
    if(alpha<0.02){ fit(); return; }
    const rep=5200*alpha, spr=0.03*alpha, damp=0.9;
    for(let i=0;i<nodes.length;i++){ const a=nodes[i];
      for(let j=i+1;j<nodes.length;j++){ const b=nodes[j];
        let dx=a.x-b.x,dy=a.y-b.y,dz=a.z-b.z; let d2=dx*dx+dy*dy+dz*dz+0.1; let f=rep/d2; let d=Math.sqrt(d2);
        dx/=d;dy/=d;dz/=d; a.vx+=dx*f;a.vy+=dy*f;a.vz+=dz*f; b.vx-=dx*f;b.vy-=dy*f;b.vz-=dz*f; }
    }
    for(const e of edges){ const a=byId[e.source], b=byId[e.target]; const L=e.kind==="contains"?64:120;
      let dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z; let d=Math.sqrt(dx*dx+dy*dy+dz*dz)+0.01; let f=(d-L)*spr;
      dx/=d;dy/=d;dz/=d; a.vx+=dx*f;a.vy+=dy*f;a.vz+=dz*f; b.vx-=dx*f;b.vy-=dy*f;b.vz-=dz*f; }
    for(const n of nodes){ n.vx-=n.x*0.0016; n.vy-=n.y*0.0016; n.vz-=n.z*0.0016;
      n.vx*=damp;n.vy*=damp;n.vz*=damp; n.x+=n.vx;n.y+=n.vy;n.z+=n.vz; }
    alpha*=0.985;
    if(alpha<0.06) fit();
  }
  // Rescale the settled layout once so it always fills the view nicely.
  function fit(){
    if(fitted || !nodes.length) return;
    let maxr=1; for(const n of nodes){ const r=Math.hypot(n.x,n.y,n.z); if(r>maxr) maxr=r; }
    const target=300, k=target/maxr;
    for(const n of nodes){ n.x*=k; n.y*=k; n.z*=k; n.vx=n.vy=n.vz=0; }
    fitted=true;
  }

  function project(n){
    const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
    let x=n.x*cy - n.z*sy, z=n.x*sy + n.z*cy, y=n.y*cp - z*sp; z=n.y*sp + z*cp;
    const f=520, s=f/(f+z+dist)*zoom;
    return {sx:W/2 + x*s, sy:H/2 + y*s, s, depth:z};
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    if(autorotate && !dragging) yaw+=0.0016;
    physics();
    // project
    for(const n of nodes){ const p=project(n); n._p=p; }
    // edges
    const acc=getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
    for(const e of edges){ const a=byId[e.source]._p, b=byId[e.target]._p;
      const hl = hover&&(e.source===hover.id||e.target===hover.id) || selected&&(e.source===selected.id||e.target===selected.id);
      ctx.strokeStyle = e.kind==="ref" ? (hl?acc:acc+"55") : (hl?acc+"aa":acc+"22");
      ctx.lineWidth = hl?1.4:0.6; ctx.beginPath(); ctx.moveTo(a.sx,a.sy); ctx.lineTo(b.sx,b.sy); ctx.stroke(); }
    // nodes back-to-front
    const order=nodes.slice().sort((a,b)=>b._p.depth - a._p.depth);
    for(const n of order){ const p=n._p; const r=Math.max(2.4,n.size*p.s*2.6);
      const focused = (hover&&hover.id===n.id)||(selected&&selected.id===n.id);
      const a = Math.min(1, 0.45 + (p.s*0.5));
      if(n.type==="folder"){ ctx.fillStyle=colorFor(n,a); ctx.save(); ctx.translate(p.sx,p.sy); ctx.rotate(Math.PI/4);
        ctx.fillRect(-r,-r,r*2,r*2); ctx.restore(); }
      else { ctx.beginPath(); ctx.arc(p.sx,p.sy,r,0,7); ctx.fillStyle=colorFor(n,a); ctx.fill(); }
      if(focused){ ctx.beginPath(); ctx.arc(p.sx,p.sy,r+4,0,7); ctx.strokeStyle=acc; ctx.lineWidth=1.5; ctx.stroke(); }
      if(focused || p.s>1.05 || n.type==="folder"&&p.s>0.8){
        ctx.fillStyle = focused?acc:("rgba(180,200,215,"+Math.min(.85,p.s*.7)+")");
        ctx.font=(focused?"600 ":"")+Math.max(9,Math.min(13,10*p.s))+'px ui-monospace,monospace';
        ctx.fillText(n.label, p.sx+r+4, p.sy+3);
      }
    }
    raf=requestAnimationFrame(render);
  }

  function pick(mx,my){
    let best=null, bd=16;
    for(const n of nodes){ const p=n._p; if(!p) continue; const dx=p.sx-mx, dy=p.sy-my; const d=Math.hypot(dx,dy);
      const r=Math.max(6,n.size*p.s*2.6+6); if(d<r && p.depth<bd){ best=n; bd=p.depth; } }
    return best;
  }

  // interactions
  cv.addEventListener("mousedown", e=>{ dragging=true; moved=0; lastX=e.clientX; lastY=e.clientY; });
  window.addEventListener("mouseup", ()=>{ dragging=false; });
  window.addEventListener("mousemove", e=>{
    const rect=cv.getBoundingClientRect(); const mx=e.clientX-rect.left, my=e.clientY-rect.top;
    if(dragging){ const dx=e.clientX-lastX, dy=e.clientY-lastY; moved+=Math.abs(dx)+Math.abs(dy);
      yaw+=dx*0.006; pitch+=dy*0.006; pitch=Math.max(-1.4,Math.min(1.4,pitch)); alpha=Math.max(alpha,0.05); lastX=e.clientX; lastY=e.clientY; return; }
    if(!document.body.classList.contains("view-brain")) return;
    const n=pick(mx,my); hover=n; const tip=$("#gtip");
    if(n){ tip.style.display="block"; tip.style.left=mx+"px"; tip.style.top=my+"px"; tip.textContent=(n.type==="folder"?"📁 ":"")+n.id; cv.style.cursor="pointer"; }
    else { tip.style.display="none"; cv.style.cursor=dragging?"grabbing":"grab"; }
  });
  cv.addEventListener("wheel", e=>{ e.preventDefault(); zoom*=(e.deltaY<0?1.1:0.9); zoom=Math.max(0.3,Math.min(4,zoom)); }, {passive:false});
  cv.addEventListener("click", e=>{ if(moved>6) return; const rect=cv.getBoundingClientRect();
    const n=pick(e.clientX-rect.left, e.clientY-rect.top); if(n) selectNode(n); });

  async function selectNode(n){
    selected=n;
    const pv=$("#preview"); pv.style.display="flex"; $("#pvTitle").textContent=n.id; $("#pvBody").textContent="…";
    if(n.type==="folder"){ const kids=nodes.filter(x=>x.id.startsWith(n.id+"/")||x.id.startsWith("dir:"+n.id+"/")||(x.type==="note"&&x.id.split("/").slice(0,-1).join("/")===n.id));
      $("#pvBody").textContent = kids.length? kids.map(k=>"• "+k.id).join("\n") : "(folder)"; $("#pvAsk").dataset.q=`Summarize my notes under the folder "${n.id}".`; return; }
    $("#pvAsk").dataset.q=`Tell me about my note "${n.id}".`;
    try{ const j=await (await fetch("/api/note?path="+encodeURIComponent(n.id))).json();
      $("#pvBody").textContent = j.error ? ("["+j.error+"]") : (j.content||"(empty)"); }
    catch(e){ $("#pvBody").textContent="[could not read note]"; }
  }
  $("#pvClose").addEventListener("click",()=>{ $("#preview").style.display="none"; selected=null; });
  $("#pvAsk").addEventListener("click", ()=>{ const q=$("#pvAsk").dataset.q||""; setView("chat"); $("#input").value=q; $("#input").focus(); });
  $("#pvOpen").addEventListener("click", ()=>{ if(selected) selectNode(selected); });
  $("#autorotate").addEventListener("click", e=>{ autorotate=!autorotate; e.currentTarget.setAttribute("aria-pressed",String(autorotate)); });
  $("#refreshGraph").addEventListener("click", ()=> load(true));

  return {
    enter(){ resize(); load(false).then(()=>{ if(!raf) raf=requestAnimationFrame(render); }); if(!raf) raf=requestAnimationFrame(render); },
    leave(){ cancelAnimationFrame(raf); raf=0; $("#gtip").style.display="none"; },
    resize
  };
})();
window.addEventListener("resize", ()=>{ if(document.body.classList.contains("view-brain")) Graph.resize(); });

// ---- boot -----------------------------------------------------------
(async function init(){
  try{
    STATE = await (await fetch("/api/state")).json();
    $("#brainpath").textContent = STATE.brain ? STATE.brain.root.replace(/^.*[\\/](?=[^\\/]*[\\/][^\\/]*$)/,"…/") : "—";
    $("#brainpath").title = STATE.brain ? STATE.brain.root : "";
    $("#modelName").textContent = STATE.model || "—";
    // populate model select
    const sel=$("#model"); const seen=new Set();
    (STATE.models||[]).forEach(m=>{ seen.add(m.id); const o=document.createElement("option"); o.value=m.id; o.textContent=m.label; sel.appendChild(o); });
    if(STATE.model && !seen.has(STATE.model)){ const o=document.createElement("option"); o.value=STATE.model; o.textContent=STATE.model+" (current)"; sel.appendChild(o); }
    sel.value = STATE.model||"";
    const n = STATE.brain ? STATE.brain.notes : 0;
    addSys(`online · ${n} note${n===1?"":"s"} in the brain · ${STATE.model}`);
  }catch(e){ addSys("could not reach the brain backend", true); }
  if("speechSynthesis" in window){ speechSynthesis.onvoiceschanged=pickVoice; pickVoice(); }
  $("#input").focus();
})();
</script>
</body>
