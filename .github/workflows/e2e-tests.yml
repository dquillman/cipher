name: Playwright E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality:
    name: Lint, Build, and Unit Tests
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            functions/package-lock.json
            marketing-dashboard/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix web
          npm ci --prefix functions
          npm ci --prefix marketing-dashboard

      - name: Lint web
        run: npm run lint --prefix web

      - name: Build web
        run: npm run build:no-prerender --prefix web

      - name: Lint and test functions
        run: |
          npm run lint --prefix functions
          npm test --prefix functions

      - name: Build marketing dashboard
        run: npm run build --prefix marketing-dashboard
  test:
    name: Run E2E Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 30
